# /etc/nsswitch.conf -- where each name database comes from. tobyOS keeps
# every one in a file under /etc; a host no file names is asked of DNS
# (/etc/resolv.conf).

passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files dns
networks:       files

protocols:      files
services:       files
ethers:         files
rpc:            files
