<?xml version="1.0"?>
<!-- Minimal fontconfig for chrome-headless-shell on tobyOS (slice 38).
     Without ANY config, fontconfig finds zero fonts and chrome paints pages
     with correct backgrounds but no glyphs at all. The Lato faces already
     ship in /etc for the kernel's own text renderer, so reuse them. -->
<fontconfig>
  <dir>/etc</dir>
  <!-- /data is the writable scratch FS (netlog + screenshots land there);
       /tmp rejected fontconfig's mkdir, which forced a full font re-scan in
       EVERY chrome process (expensive under TCG). NOTE: XML comments must
       not contain double hyphens; fontconfig hard-rejects the whole file. -->
  <cachedir>/data/fontcache</cachedir>
  <alias>
    <family>system-ui</family>
    <prefer><family>Lato</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Lato</family></prefer>
  </alias>
  <!-- Slice 117: real serif and monospace faces (DejaVu, free license).
       Until now every generic family aliased to Lato, so code blocks and
       pre-formatted text rendered PROPORTIONAL (alignment broken) and
       serif sites lost their look entirely. Twemoji stays the emoji
       preference; Unifont remains the pan-Unicode last resort via the
       /etc dir scan. -->
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
