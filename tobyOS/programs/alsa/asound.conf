# /etc/asound.conf -- tobyOS ALSA site configuration (audio slice 4).
#
# The library is UNMODIFIED upstream alsa-lib 1.2.8 and the config tree in
# /usr/share/alsa is upstream Debian's, verbatim. This file is the standard
# site override that alsa.conf sources near the end of its own parse (see
# its "/etc/asound.conf|||/usr/etc/asound.conf" line) -- the same mechanism
# any Linux administrator uses. Nothing here patches alsa-lib.
#
# WHY IT IS NEEDED: upstream's `default` resolves through the `cards`
# aliases to dmix, the software-mixing plugin. dmix multiplexes several
# clients onto one device by putting its mixing buffer in SysV shared
# memory guarded by a SysV semaphore -- neither of which tobyOS
# implements. We do our mixing in the kernel (audio_engine.c) instead, so
# a client should talk to the hardware device directly and let the kernel
# mix. That is what `plug` -> `hw:0,0` does.
#
# `plug` is a built-in alsa-lib plugin (like `rate` and `route`), not a
# dlopen'd module, so this needs no libasound_module_pcm_*.so on disk --
# only `pulse`, `jack` and friends are external. It transparently converts
# rate/format/channels when a client asks for something the device does
# not offer, which is exactly the flexibility Chromium expects.

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
